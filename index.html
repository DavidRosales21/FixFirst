<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="color-scheme" content="light dark" />
    <title>FixNext — Before the Breach</title>
    <meta name="description" content="FixNext ranks 2026's CVEs by how likely they are to be exploited, so teams know what to fix next. Sheridan Datathon 2026 · IBM track." />
    <meta property="og:title" content="FixNext — Before the Breach" />
    <meta property="og:description" content="Which 2026 CVEs to fix next, ranked before they're exploited. Sheridan Datathon 2026 · IBM track." />
    <meta property="og:url" content="https://fixnext.select/" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
    <style>
      @font-face { font-family: "IBM Plex Sans"; src: url("app/static/ibm-plex-sans-latin-300-normal.woff2") format("woff2"); font-weight: 300; font-display: swap; }
      @font-face { font-family: "IBM Plex Sans"; src: url("app/static/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "IBM Plex Sans"; src: url("app/static/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }

      /* Carbon colors from app/.streamlit/config.toml */
      :root { --bg: #ffffff; --panel: #f4f4f4; --text: #161616; --muted: #525252; --line: #e0e0e0; --blue: #0f62fe; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { --bg: #161616; --panel: #262626; --text: #f4f4f4; --muted: #a8a8a8; --line: #393939; --blue: #78a9ff; }
      }
      :root[data-theme="dark"] { --bg: #161616; --panel: #262626; --text: #f4f4f4; --muted: #a8a8a8; --line: #393939; --blue: #78a9ff; }

      html, body { margin: 0; background: var(--bg); }

      #ff-boot {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; align-items: center; justify-content: center; padding: 16px;
        background: var(--bg); color: var(--text);
        font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
        transition: opacity 0.35s ease;
      }
      #ff-boot.ff-done { opacity: 0; pointer-events: none; }
      .ff-boot-card { width: 100%; max-width: 440px; }
      .ff-boot-brand { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
      .ff-boot-tag { font-size: 14px; font-weight: 300; color: var(--muted); margin: 2px 0 28px; }
      .ff-boot-bar { height: 4px; background: var(--line); overflow: hidden; position: relative; }
      .ff-boot-bar::after {
        content: ""; position: absolute; inset: 0 auto 0 0; width: 35%;
        background: var(--blue); animation: ff-slide 1.4s ease-in-out infinite;
      }
      @keyframes ff-slide { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
      @media (prefers-reduced-motion: reduce) { .ff-boot-bar::after { animation: none; width: 100%; opacity: 0.6; } }
      .ff-boot-step { font-size: 16px; margin: 16px 0 6px; }
      .ff-boot-note { font-size: 13px; line-height: 1.5; color: var(--muted); margin: 0; }
    </style>
  </head>
  <body>
    <div id="ff-boot" role="status" aria-live="polite">
      <div class="ff-boot-card">
        <p class="ff-boot-brand">FixNext</p>
        <p class="ff-boot-tag">Before the Breach · Sheridan Datathon 2026 · IBM track</p>
        <div class="ff-boot-bar" aria-hidden="true"></div>
        <p class="ff-boot-step" id="ff-boot-step">Loading the dashboard…</p>
        <p class="ff-boot-note" id="ff-boot-note">The whole app runs in your browser, so Python starts up here first. This takes about 20–30 seconds.</p>
      </div>
    </div>
    <div id="root"></div>

    <script>
      // Match the loading screen to the theme the viewer last picked inside the app.
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k.indexOf("stActiveTheme-") === 0) {
            var v = JSON.parse(localStorage.getItem(k));
            var name = (v && v.name) || v;
            if (name === "Light") document.documentElement.setAttribute("data-theme", "light");
            if (name === "Dark") document.documentElement.setAttribute("data-theme", "dark");
          }
        }
      } catch (e) {}
    </script>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";

      const boot = document.getElementById("ff-boot");
      const step = document.getElementById("ff-boot-step");
      const note = document.getElementById("ff-boot-note");

      // Hide the loading screen as soon as the dashboard's header is on the page.
      const ready = () => document.querySelector(".st-key-ffheader");
      const observer = new MutationObserver(() => {
        if (ready()) {
          observer.disconnect();
          boot.classList.add("ff-done");
          setTimeout(() => boot.remove(), 400);
        }
      });
      observer.observe(document.getElementById("root"), { childList: true, subtree: true });

      const steps = [
        [6000, "Starting Python…"],
        [12000, "Loading pandas and Plotly…"],
        [18000, "Ranking the CVEs…"],
        [45000, "Still loading — a slow connection can take up to a minute."],
      ];
      steps.forEach(([ms, text]) => setTimeout(() => { if (!ready()) step.textContent = text; }, ms));
      setTimeout(() => {
        if (!ready()) note.textContent = "If nothing shows up, reload the page.";
      }, 90000);

      const files = {
        "app.py": { url: "app/app.py" },
        "sample_ranked_2026.csv": { url: "app/sample_ranked_2026.csv" },
        "sample_backtest.csv": { url: "app/sample_backtest.csv" },
        ".streamlit/config.toml": { url: "app/.streamlit/config.toml" },
      };
      // The model's drop-in files: copied into app/ on this branch, they replace the sample
      // (app.py prefers them when present). Until then these checks just come back 404.
      for (const name of ["ranked_light.csv", "backtest.csv"]) {
        try {
          const res = await fetch(`app/${name}`, { method: "HEAD", cache: "no-store" });
          if (res.ok) files[name] = { url: `app/${name}` };
        } catch (e) {}
      }

      try {
        mount(
          {
            requirements: ["plotly"],
            entrypoint: "app.py",
            // The FixNext loading screen shows progress; stlite's own toasts would linger over the app.
            disableProgressToasts: true,
            disableModuleAutoLoadToasts: true,
            files,
          },
          document.getElementById("root"),
        );
      } catch (e) {
        step.textContent = "The dashboard couldn't start.";
        note.textContent = "Reload the page to try again.";
      }
    </script>
  </body>
</html>
