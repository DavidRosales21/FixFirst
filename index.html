<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="color-scheme" content="light dark" />
    <title>FixNext — Before the Breach</title>
    <meta name="description" content="FixNext ranks 2026's CVEs by how likely they are to be exploited, so teams know what to fix next. Sheridan Datathon 2026 · IBM track." />
    <meta property="og:title" content="FixNext — Before the Breach" />
    <meta property="og:description" content="Which 2026 CVEs to fix next, ranked before they're exploited. Sheridan Datathon 2026 · IBM track." />
    <meta property="og:url" content="https://fixnext.select/" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
    <!--
      fixnext.select shows the live app from Streamlit Community Cloud (fixnext.streamlit.app), which has
      Ask FixNext (Gemini). Community Cloud has no custom domains, so the app is embedded full-screen with
      ?embed=true, the official way to iframe a Streamlit app. The in-browser (stlite) copy is at /lite.html.
    -->
    <style>
      :root { --bg: #0f1a1a; }
      @media (prefers-color-scheme: light) { :root { --bg: #ffffff; } }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
      iframe { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; display: block; }
    </style>
  </head>
  <body>
    <iframe
      src="https://fixnext.streamlit.app/?embed=true"
      title="FixNext dashboard"
      allow="clipboard-read; clipboard-write; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </body>
</html>
